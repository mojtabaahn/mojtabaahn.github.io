experience:
  - period: 2024 — Present
    company: Basalam.com
    position: DevOps Engineer
    description: >
      As a DevOps Engineer with much experience in "Dev" part my major mission is to bring automation
      as much as possible to manual "Ops" parts. This includes making a SAAS for developers to minimize
      ops demands among developers.

  - period: 2020 — 2024
    company: Basalam.com
    position: Software Developer
    description: >
      Basalam is an e-commerce platform in retail market. Migration from monolithic to microservices was
      a major challenge as I entered the company. the legacy project stack was PHP/Laravel with GraphQL
      interface. Initially I've migrated the authentication and authorization logics to a separate
      microservice with PHP/Laravel/Passport stack named Auth. Later I've migrated basket management
      logics to a new service with Python/FastAPI backed service named Order. Main challenges we faced
      was communication between services after migration to microservices, optimising response time,
      asynchronous programming, load tests, unit testings and developing a framework on top of FastAPI
      and 10+ packages for better maintainability and scalability concerns.

  - period: 2019 — 2020
    company: Citek.ir
    position: Software Developer
    description: >
      Citek group is a software development company that works on client and its own projects. in about
      6 months we worked together I developed a delivery startup software using Laravel, Livewire and
      tailwindcss.

  - period: 2017 — 2019
    company: Arcademy.ir
    position: Co-Founder & Software Developer
    description: >
      Arcademy is an e-learning platform founded by Amirhosein Abdollahzadeh, Mohammad Fani and I.
      The website had 3 major releases, All backed by Laravel framework. Our front-end implementation
      started with SASS and custom styles on first and second version. Our final - current - version
      utilized Vue.js and Inertia.js for front-end and TailwindCSS for styling. Major technical
      challenges we faced these years were related to tech-stack selection, methods of maintenance
      and development of source code, data caching for better response time, implementing integrated
      CRM and CMS, and better UX.

