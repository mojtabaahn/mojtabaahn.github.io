professional_summary: |
  Full-stack Software Developer and DevOps Engineer with 8+ years of experience in building and scaling web applications.
  Currently leading the microservices migration at Basalam.com, transforming a monolithic Laravel/GraphQL application
  into a modern, scalable architecture using Python/FastAPI.

  #### Specialized in
  * Microservices Architecture & System Design
  * Python/FastAPI & PHP/Laravel Ecosystems
  * DevOps & Cloud Infrastructure
  * Performance Optimization & Scalability

  #### Key achievements include
  * Successfully migrated critical services (Auth, Order, Wallet) from Laravel to Python/FastAPI
  * Developed internal PaaS & DBaaS solutions to streamline development workflows
  * Created and maintained several open-source tools for Python development
  * Co-founded and developed Arcademy, an e-learning platform with integrated CRM/CMS

  Passionate about clean code, automation, and building developer tools that enhance productivity.

