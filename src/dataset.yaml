experience:
  - period: 2024 — Present
    company: Basalam.com
    position: DevOps Engineer
    description: |
      As a DevOps Engineer with much experience in "Dev" part my major mission is to bring automation
      as much as possible to manual "Ops" parts. My primary focus is developing **Titan PaaS**, an enterprise
      Kubernetes management platform that eliminates the traditional complexity of container orchestration.

      **Key achievements with Titan:**
      * Built a platform enabling any developer to deploy production-ready services without DevOps expertise
      * Implemented one-click deployment for databases (PostgreSQL, MySQL, MongoDB), caching (Redis), messaging (Kafka), and storage (MinIO)
      * Developed multi-cluster management supporting 120+ node clusters handling 10,000 requests per second
      * Created intuitive wizards for complex operations like DNS configuration, TLS management, and Git-based deployments
      * Designed enterprise architecture with organizations, workspaces, projects hierarchy and complete audit trails

  - period: 2020 — 2024
    company: Basalam.com
    position: Software Developer
    description: |
      Basalam is an e-commerce platform in retail market. Migration from monolithic to microservices was
      a major challenge as I entered the company. The legacy project stack was PHP/Laravel with GraphQL
      interface.

      **Microservices developed/migrated:**
      * **Auth** - Migrated authentication and authorization logics from monolith (PHP/Laravel/Passport)
      * **Order** - Migrated basket management logics to Python/FastAPI
      * **Wallet** - Migrated wallet service from Laravel to Python/FastAPI
      * **Accounting & Financial** - Built new microservice from scratch for financial transactions and reporting
      * **ContraX** - Developed contradiction monitoring system for solving data inconsistencies between microservices

      **Main challenges addressed:**
      * Inter-service communication in microservices architecture
      * Response time optimization
      * Asynchronous programming patterns
      * Load testing and unit testing strategies
      * Developing a framework on top of FastAPI with 10+ packages for better maintainability and scalability

  - period: 2019 — 2020
    company: Citek.ir
    position: Software Developer
    description: >
      Citek group is a software development company that works on client and its own projects. in about
      6 months we worked together I developed a delivery startup software using Laravel, Livewire and
      tailwindcss.

  - period: 2017 — 2019
    company: Arcademy.ir
    position: Co-Founder & Software Developer
    description: |
      Co-founded Arcademy, an e-learning platform for software development education, with Amirhosein Abdollahzadeh
      and Mohammad Fani. As the lead developer, I architected and implemented the entire platform through three
      major iterations.

      **Technical Evolution:**
      * **Version 1 & 2**: Built with Laravel backend and SASS/custom CSS for frontend
      * **Version 3**: Modernized stack with Laravel, Vue.js, Inertia.js, and TailwindCSS for improved SPA experience

      **Key Implementations:**
      * Developed integrated **CRM system** for student lifecycle management and automated marketing campaigns
      * Built custom **CMS** for course creation and content management
      * Implemented **video upload and playback system** with progress tracking using HTML5 video
      * Created **payment gateway integration** with Iranian payment providers
      * Designed **role-based access control** for instructors, students, and administrators
      * Built **email notification system** for course updates and announcements

      **Technical Challenges Solved:**
      * Optimized database queries and implemented **Redis caching** reducing page load time by 70%
      * Implemented **SEO optimization** strategies improving organic traffic by 200%
      * Created **responsive design** ensuring seamless experience across all devices
      * Built **analytics dashboard** for tracking student engagement and course performance
      * Handled **video file storage and delivery** optimization for smooth playback

      **Business Impact:**
      * Served 1500+ students during operational period
      * Hosted 50+ courses across various programming topics
      * Achieved 95% uptime with minimal infrastructure costs

